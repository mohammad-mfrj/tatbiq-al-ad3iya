<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1626">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="أدعية">
  <meta name="description" content="أدعية وأذكار بتصميم أنيق وقراءة مريحة">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="icon" href="./icon-192.png" type="image/png">
  <link rel="stylesheet" href="./style.css">
  <title>أدعية</title>
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <div class="app">
    <header class="top" aria-label="عنوان التطبيق">
      <span class="top-rule" aria-hidden="true"></span>
      <span class="brand">أدعية</span>
      <span class="top-rule" aria-hidden="true"></span>
    </header>
    <main id="touchSurface" class="touch-surface" role="region" tabindex="0"
      aria-label="للدعاء السابق اضغط يمين الشاشة، وللتالي اضغط يسار الشاشة. السحب يمينًا للسابق ويسارًا للتالي">
      <article class="dua-card" aria-live="polite">
        <div class="medallion" aria-hidden="true"><span></span></div>
        <p class="eyebrow">دُعَاءٌ وَذِكْرٌ</p>
        <h1 id="duaTitle" class="dua-title">أدعية</h1>
        <div class="rule" aria-hidden="true"><span></span></div>
        <p id="duaText" class="dua-text">جارٍ تحميل الأدعية…</p>
        <p id="duaSource" class="dua-source"></p>
        <div class="end-flower" aria-hidden="true"><span></span></div>
      </article>
    </main>
    <footer class="footer" aria-label="التنقل بين الأدعية">
      <div class="footer-navigation">
        <button type="button" id="prevBtn" class="nav-control" aria-label="الدعاء السابق" disabled>
          <span class="nav-arrow arrow-right" aria-hidden="true"></span>
          <span>السابق</span>
        </button>
        <div id="progressRing" class="progress-ring" role="progressbar"
          aria-label="التقدم في قراءة الأدعية" aria-valuemin="1" aria-valuemax="1" aria-valuenow="1">
          <div class="progress-inner">
            <span id="pageNumber" class="progress-number">01</span>
            <span id="pageTotal" class="progress-total">من 01</span>
          </div>
        </div>
        <button type="button" id="nextBtn" class="nav-control" aria-label="الدعاء التالي" disabled>
          <span class="nav-arrow arrow-left" aria-hidden="true"></span>
          <span>التالي</span>
        </button>
      </div>
      <p class="instruction">اضغط يمينًا للرجوع · ويسارًا للتقدم</p>
      <span id="counter" class="sr-only" aria-live="polite"></span>
    </footer>
  </div>
  <script src="./app.js" defer></script>
</body>
</html>
